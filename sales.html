<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판매 현황 - 유팡 박람회</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1a1a1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-tile { background: #f9fafb; border: 1px solid #eee; border-radius: 8px; padding: 16px; }
  .stat-tile .label { font-size: 12px; color: #777; }
  .stat-row { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  /* 금액이 커지면 sales.js fitStatValues()가 타일 폭에 맞춰 글자를 줄여 한 줄 유지 */
  .stat-tile { min-width: 0; }
  .stat-tile .value { font-size: 24px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; }
  #expo-select { max-width: 260px; margin-bottom: 16px; }
  .stat-tile .sub { font-size: 12px; color: #52514e; margin-top: 4px; line-height: 1.5; }
  .share { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
  #share-pie { width: 200px; height: 200px; flex-shrink: 0; }
  #share-pie path { cursor: default; transition: opacity .12s; }
  #share-pie:hover path:not(:hover) { opacity: .45; }
  .share-legend { margin-top: 0; }
  .share .table-scroll { flex: 1 1 300px; min-width: 0; }
  @media (max-width: 600px) { .share { justify-content: center; } }
  .share-legend td:nth-child(n+2), .share-legend th:nth-child(n+2) { text-align: right; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .expo-summary-row { cursor: pointer; }
  .expo-summary-row:hover { background: #f9fafb; }
</style>
</head>
<body>

<div id="app" class="hidden">
  <header>
    <h1>판매 현황</h1>
    <div id="userbar">
      <a href="admin.html" style="text-decoration:none;">☰ 메뉴</a>
      <button id="logout-btn">로그아웃</button>
    </div>
  </header>
  <main>
    <div class="card">
      <h2>박람회별 요약 (전체 매출 비교)</h2>
      <div class="table-scroll"><table>
        <thead><tr><th>박람회</th><th>건수</th><th>수량</th><th>매출액</th></tr></thead>
        <tbody id="expo-summary-tbody"></tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>박람회 상세</h2>
        <div class="right">
          <button class="ghost" id="refresh-btn">새로고침</button>
        </div>
      </div>
      <div class="filter-row">
        <select id="expo-select"></select>
      </div>

      <div class="stat-row">
        <div class="stat-tile"><div class="label">총 주문 건수</div><div class="value" id="stat-count">-</div></div>
        <div class="stat-tile"><div class="label">총 수량</div><div class="value" id="stat-qty">-</div></div>
        <div class="stat-tile"><div class="label">총 주문금액</div><div class="value" id="stat-amount">-</div></div>
        <div class="stat-tile"><div class="label">사은품 지급 건수</div><div class="value" id="stat-gift-count">-</div><div style="font-size:12px;color:#777;margin-top:2px;" id="stat-gift-fee"></div></div>
        <div class="stat-tile"><div class="label">젖병소독기 총 수량</div><div class="value" id="stat-steril-qty">-</div><div class="sub" id="stat-steril-sub"></div></div>
        <div class="stat-tile"><div class="label">분유포트 총 수량</div><div class="value" id="stat-pot-qty">-</div><div class="sub" id="stat-pot-sub"></div></div>
      </div>

      <h2>매출 비중</h2>
      <div class="share">
        <svg id="share-pie" viewBox="0 0 200 200" role="img" aria-label="매출 비중 원형 그래프"></svg>
        <div class="table-scroll"><table class="share-legend">
          <thead><tr><th>구분</th><th>수량</th><th>매출액</th><th>비중</th></tr></thead>
          <tbody id="share-tbody"></tbody>
        </table></div>
      </div>

      <h2>일별 요약</h2>
      <div class="table-scroll"><table>
        <thead><tr><th>날짜</th><th>소독기 건수</th><th>소독기 수량</th><th>분유포트 건수</th><th>분유포트 수량</th><th>ACC 건수</th><th>ACC 수량</th><th>매출액</th></tr></thead>
        <tbody id="daily-tbody"></tbody>
      </table></div>

      <h2 style="margin-top:24px;">메인 제품별 판매 현황 <span id="main-qty-badge" style="font-weight:400;font-size:13px;color:#777;"></span></h2>
      <div class="table-scroll"><table>
        <thead><tr><th>상품명</th><th>옵션명(컬러)</th><th>건수</th><th>수량</th></tr></thead>
        <tbody id="main-tbody"></tbody>
      </table></div>

      <h2 style="margin-top:24px;">액세서리(ACC)별 판매 현황 <span id="acc-qty-badge" style="font-weight:400;font-size:13px;color:#777;"></span></h2>
      <div class="table-scroll"><table>
        <thead><tr><th>상품명</th><th>옵션명</th><th>건수</th><th>수량</th></tr></thead>
        <tbody id="acc-tbody"></tbody>
      </table></div>
    </div>
  </main>
</div>

<script src="client.js"></script>
<script src="sales.js"></script>
</body>
</html>
