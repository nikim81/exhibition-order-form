<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 유팡 박람회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .menu-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 36px 16px; border-radius: 12px;
    background: #fff; border: 1px solid #e5e7eb; text-decoration: none; color: #222;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .menu-btn:hover { background: #f3f4f6; }
  .menu-btn .icon { font-size: 32px; }
</style>
</head>
<body>

<div id="pin-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;">
  <div style="background:#fff;border-radius:10px;padding:24px;width:min(320px,90vw);">
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:8px;">관리자 비밀번호를 입력하세요</label>
    <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:4px;font-size:14px;box-sizing:border-box;">
    <div id="pin-err" style="color:#dc2626;font-size:13px;min-height:18px;margin-top:6px;"></div>
    <button class="primary" id="pin-submit-btn" style="width:100%;margin:8px 0 0;">확인</button>
    <a href="index.html" style="display:block;text-align:center;font-size:13px;color:#777;margin-top:10px;">취소</a>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>관리자</h1>
    <div id="userbar">
      <button id="logout-btn">로그아웃</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="menu-grid">
        <a href="index.html" class="menu-btn"><span class="icon">📝</span>주문 입력</a>
        <a href="orders.html" class="menu-btn"><span class="icon">📋</span>주문 목록</a>
        <a href="sales.html" class="menu-btn"><span class="icon">📊</span>판매 현황</a>
        <a href="settings.html" class="menu-btn"><span class="icon">⚙</span>세팅</a>
      </div>
    </div>
  </main>
</div>

<script src="client.js"></script>
<script>
  document.getElementById("logout-btn").addEventListener("click", () => sb.auth.signOut());

  // 로그인된 스태프 중에서도 관리자 메뉴 진입을 한 번 더 막는 간단한 PIN.
  // 실제 PIN 값은 클라이언트 코드에 없고, DB의 verify_admin_pin() 함수가 서버 쪽에서만 대조함
  // (개발자도구로 소스를 봐도 PIN이 노출되지 않음).
  // 주문 입력(index.html)에서 넘어올 때만 물어보고, 세팅/주문목록/판매현황에서 "☰ 메뉴"로
  // 돌아올 때는 다시 안 물어봄 (index.html이 이 값을 매번 지워서, 거길 거쳐야 재입력됨).
  function askAdminPin() {
    return new Promise((resolve) => {
      if (sessionStorage.getItem("adminUnlocked") === "1") { resolve(); return; }
      const modal = document.getElementById("pin-modal");
      const input = document.getElementById("pin-input");
      const err = document.getElementById("pin-err");
      const submitBtn = document.getElementById("pin-submit-btn");
      modal.classList.remove("hidden");
      input.focus();

      async function submit() {
        submitBtn.disabled = true;
        const { data, error } = await sb.rpc("verify_admin_pin", { input: input.value });
        submitBtn.disabled = false;
        if (!error && data === true) {
          sessionStorage.setItem("adminUnlocked", "1");
          modal.classList.add("hidden");
          resolve();
        } else {
          err.textContent = "비밀번호가 올바르지 않습니다.";
          input.value = "";
          input.focus();
        }
      }
      document.getElementById("pin-submit-btn").addEventListener("click", submit);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    });
  }

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = "index.html"; return; }
    await askAdminPin();
    document.getElementById("app").classList.remove("hidden");
  })();
</script>
</body>
</html>
