<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 유팡 박람회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .menu-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 36px 16px; border-radius: 12px;
    background: #fff; border: 1px solid #e5e7eb; text-decoration: none; color: #222;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .menu-btn:hover { background: #f3f4f6; }
  .menu-btn .icon { font-size: 32px; }
</style>
</head>
<body>

<div id="app" class="hidden">
  <header>
    <h1>관리자</h1>
    <div id="userbar">
      <button id="logout-btn">로그아웃</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="menu-grid">
        <a href="index.html" class="menu-btn"><span class="icon">📝</span>주문 입력</a>
        <a href="orders.html" class="menu-btn"><span class="icon">📋</span>주문 목록</a>
        <a href="sales.html" class="menu-btn"><span class="icon">📊</span>판매 현황</a>
        <a href="settings.html" class="menu-btn"><span class="icon">⚙</span>세팅</a>
      </div>
    </div>
  </main>
</div>

<script src="client.js"></script>
<script>
  document.getElementById("logout-btn").addEventListener("click", () => sb.auth.signOut());
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = "index.html"; return; }

    // 로그인된 스태프 중에서도 관리자 메뉴 진입을 한 번 더 막는 간단한 PIN (탭을 닫기 전까지 유지)
    if (sessionStorage.getItem("adminUnlocked") !== "1") {
      const pw = prompt("관리자 비밀번호를 입력하세요");
      if (pw !== "025118888") { alert("비밀번호가 올바르지 않습니다."); location.href = "index.html"; return; }
      sessionStorage.setItem("adminUnlocked", "1");
    }

    document.getElementById("app").classList.remove("hidden");
  })();
</script>
</body>
</html>
