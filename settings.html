<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세팅 - 유팡 박람회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .group { border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; }
  .group-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .group-title input { width: auto; }
  .opt-row { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 0 2px 20px; }
  .opt-row input { width: auto; }
  .inline { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .inline select, .inline input { width: auto; flex: 1; }
  .pill-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .pill { display: flex; justify-content: space-between; align-items: center; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .pill button { font-size: 12px; padding: 4px 8px; cursor: pointer; }
  .bundle-card { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; margin-top: 10px; font-size: 13px; }
  .bundle-card .head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .bundle-card ul { margin: 6px 0 0; padding-left: 18px; }
  .save-bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #eee; padding: 12px 0; margin-top: 20px; text-align: right; }
  .expo-card { display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
  .expo-card.active { border-color: #059669; background: #f0fdf4; }
  .expo-card .badge { font-size: 11px; color: #059669; font-weight: 700; margin-left: 6px; }
  .expo-card .actions button { font-size: 12px; padding: 5px 10px; margin-left: 6px; cursor: pointer; }
  .price-input { width: 90px !important; margin-left: auto; font-size: 12px !important; padding: 4px 6px !important; }
  .opt-row { justify-content: flex-start; }
</style>
</head>
<body>

<div id="app" class="hidden">
  <header>
    <h1>세팅</h1>
    <div id="userbar">
      <a href="admin.html" class="ghost" style="color:#fff;text-decoration:none;padding:6px 12px;border-radius:4px;background:#374151;">☰ 메뉴</a>
      <button id="logout-btn">로그아웃</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="card-header">
        <h2>박람회 목록</h2>
        <button class="ghost" id="new-expo-btn">+ 새 박람회</button>
      </div>
      <div id="expo-list"></div>
    </div>

    <div class="card">
      <h2>박람회 정보 <span id="editing-label" style="font-weight:400;font-size:13px;color:#777;"></span></h2>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
        <input type="checkbox" id="s-활성" style="width:auto;"> 이 박람회를 주문 입력 화면에서 사용 (활성화)
      </label>
      <label>박람회명</label>
      <input id="s-박람회명" placeholder="예: 9월 수원 박람회">
      <div class="row2">
        <div><label>시작일</label><input id="s-시작일" type="date" min="2020-01-01" max="2099-12-31"></div>
        <div><label>종료일</label><input id="s-종료일" type="date" min="2020-01-01" max="2099-12-31"></div>
      </div>
    </div>

    <div class="card">
      <h2>판매 제품 선택</h2>
      <p style="font-size:12px;color:#777;margin-top:-6px;">이번 박람회에서 실제로 파는 제품만 체크하고, 가격을 입력하세요. 주문 입력 화면에서 옵션 선택 시 가격이 자동으로 채워집니다.</p>
      <div id="product-groups"></div>
    </div>

    <div class="card">
      <h2>사은품</h2>
      <p style="font-size:12px;color:#777;margin-top:-6px;">이번 박람회에서 지급할 사은품만 추가하세요. 현장수령/배송 여부는 주문 입력 화면에서 고객마다 선택합니다.</p>
      <div class="inline">
        <select id="gift-product"></select>
        <button class="ghost" id="gift-add-btn">+ 추가</button>
      </div>
      <div class="pill-list" id="gift-list"></div>
    </div>

    <div class="card">
      <h2>세트 상품 분해 (묶음 구성)</h2>
      <p style="font-size:12px;color:#777;margin-top:-6px;">묶음 상품을 주문받으면, 사방넷 다운로드 시 아래 구성품들로 나뉘어 각각 한 줄씩 올라갑니다.</p>

      <div class="inline" style="margin-top:10px;">
        <select id="bundle-template-select"><option value="">-- 저장된 묶음 템플릿 불러오기 --</option></select>
        <button class="ghost" id="bundle-template-load-btn">불러오기</button>
        <button class="ghost" id="bundle-template-save-btn">현재 구성 템플릿으로 저장</button>
      </div>

      <label>본품 (묶음 상품)</label>
      <select id="bundle-base"></select>

      <div id="bundle-parts" style="margin-top:10px;"></div>
      <div class="inline">
        <select id="bundle-part-product"></select>
        <input id="bundle-part-qty" type="number" min="1" value="1" style="max-width:80px;">
        <button class="ghost" id="bundle-part-add-btn">+ 구성품 추가</button>
      </div>
      <button class="primary" id="bundle-save-btn">이 묶음 저장</button>
      <button class="ghost hidden" id="bundle-cancel-btn">취소</button>

      <div id="bundle-list"></div>
    </div>

    <div class="save-bar">
      <span id="save-msg" style="font-size:13px;color:#059669;margin-right:12px;"></span>
      <button class="primary" id="save-btn">전체 저장</button>
    </div>
  </main>
</div>

<script src="client.js"></script>
<script src="products.js"></script>
<script src="settings.js"></script>
</body>
</html>
