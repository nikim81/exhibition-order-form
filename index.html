<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유팡 박람회 출고 요청서</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="customer.css">
</head>
<body>

<div id="login-card" class="card">
  <img class="logo" src="images/upang-logo.png" alt="UPANG">
  <h2>스태프 로그인</h2>
  <label>이메일</label>
  <input id="login-email" type="email" autocomplete="username">
  <label>비밀번호</label>
  <input id="login-pw" type="password" autocomplete="current-password">
  <div id="login-err" style="color:#dc2626;font-size:13px;min-height:18px;margin-top:6px;"></div>
  <button class="primary" id="login-btn" style="width:100%;">로그인</button>
</div>

<div id="app" class="hidden">
  <div id="staff-corner">
    <a href="admin.html" title="관리자">🔒</a>
    <button id="logout-btn" title="로그아웃">⎋</button>
  </div>
  <header>
    <img class="logo" src="images/upang-logo.png" alt="UPANG">
    <div class="expo-name" id="expo-name"></div>
    <div class="tagline">박람회 현장 주문서</div>
  </header>
  <main>
    <div id="addr-modal" class="hidden">
      <div id="addr-modal-inner">
        <button type="button" id="addr-modal-close">✕</button>
        <div id="addr-embed"></div>
      </div>
    </div>

    <div class="card">
      <h2 id="form-title">주문 입력</h2>

      <div class="zone zone-customer">
        <div class="zone-tag">✏ 고객 작성</div>
        <label>성함 *</label>
        <input id="f-수취인">
        <label>연락처 *</label>
        <input id="f-연락처" type="tel" inputmode="numeric" placeholder="010-0000-0000">
        <label>주소 *</label>
        <div class="addr-row">
          <input id="f-우편번호" readonly placeholder="우편번호" class="zip-input">
          <input id="f-주소" readonly placeholder="주소 검색을 눌러주세요">
          <button type="button" class="ghost" id="addr-search-btn">🔍 주소 검색</button>
        </div>
        <input id="f-상세주소" placeholder="상세주소 (동/호수 등)" style="margin-top:8px;">

        <div id="privacy-notice" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px;margin-top:16px;font-size:12px;color:#444;line-height:1.6;">
          <strong>개인정보 수집·이용 동의</strong><br>
          · 수집 항목: 수취인명, 연락처, 우편번호, 주소, 배송메세지<br>
          · 수집 목적: 박람회 현장 주문 접수 및 상품 배송<br>
          · 보유 기간: 배송 완료 후 3개월 (관계 법령에 따라 보관 의무가 있는 경우 해당 기간까지)<br>
          · 동의를 거부할 권리가 있으며, 거부 시 주문 접수가 제한될 수 있습니다.
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:8px;">
          <input type="checkbox" id="f-동의" style="width:auto;">
          위 개인정보 수집·이용에 동의합니다 *
        </label>
      </div>

      <div class="tear-line"><span>✂ 여기까지 작성</span></div>

      <div class="zone zone-staff">
        <div class="zone-tag">🧾 직원 입력</div>
        <label>주문일</label>
        <input id="f-주문일" type="date" readonly>
        <label>1단. 젖병소독기</label>
        <div id="tier-tabs" class="tier-tabs">
          <button type="button" class="tier-btn" data-tier="단품">단품</button>
          <button type="button" class="tier-btn" data-tier="3종">3종(세로+수납+다용도 포함)</button>
          <button type="button" class="tier-btn" data-tier="4종">4종(+멀티선반 포함)</button>
        </div>
        <div id="sterilizer-grid" class="swatch-grid"></div>
        <div class="row2" style="align-items:end;">
          <div><label>수량</label><input id="steril-qty" type="number" min="1" value="1"></div>
          <button type="button" class="primary" id="steril-add-btn" style="margin-top:0;">+ 담기</button>
        </div>

        <label style="margin-top:16px;" id="acc-label">2단. 액세서리 (선택 안 해도 됨, 단품 선택 시에만 담을 수 있어요)</label>
        <div id="acc-grid" class="swatch-grid"></div>

        <label style="margin-top:16px;">선택한 상품</label>
        <div id="cart-list"></div>
        <div id="cart-total"></div>

        <label>배송메세지</label>
        <textarea id="f-배송메세지" rows="2"></textarea>
      </div>

      <div id="err"></div>
      <button class="primary" id="submit-btn">주문 저장</button>
      <button class="ghost hidden" id="cancel-edit-btn">취소</button>
    </div>
  </main>
</div>

<script src="client.js"></script>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
